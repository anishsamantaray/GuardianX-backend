name: Deploy FastAPI with :latest tag

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_URI: ${{ secrets.ECR_URI }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3


      # -----------------------------
      # Setup Python (for tests + sonar)
      # -----------------------------
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov


      # -----------------------------
      # Run Tests + Coverage
      # -----------------------------
      - name: Run Tests
        run: |
          pytest --cov=app --cov-report=xml


      # -----------------------------
      # SonarQube Scan
      # -----------------------------
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


      # -----------------------------
      # AWS Setup
      # -----------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_URI


      # -----------------------------
      # Docker Build & Push
      # -----------------------------
      - name: Build and Push Docker Image (latest tag)
        run: |
          docker build -t guardianx-backend:latest .
          docker tag guardianx-backend:latest $ECR_URI:latest
          docker push $ECR_URI:latest


      # -----------------------------
      # Force Lambda update
      # -----------------------------
      - name: Create dummy build file to force Lambda update
        run: |
          echo "Build ID: $GITHUB_SHA" > .build_id


      # -----------------------------
      # Terraform Setup
      # -----------------------------
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        run: |
          cd terraform
          terraform init


      # -----------------------------
      # Generate terraform.tfvars
      # -----------------------------
      - name: Generate terraform.tfvars from GitHub Secrets
        run: |
          cat <<EOF > terraform/terraform.tfvars
          project_name = "guardianx"
          incident_table_name = "${{ secrets.INCIDENT_TABLE_NAME }}"
          lambda_env_vars = {
            SMTP_HOST = "${{ secrets.SMTP_HOST }}"
            SMTP_PORT = "${{ secrets.SMTP_PORT }}"
            SMTP_USER = "${{ secrets.SMTP_USER }}"
            SMTP_PASS = "${{ secrets.SMTP_PASS }}"
            JWT_SECRET_KEY = "${{ secrets.JWT_SECRET_KEY }}"
            JWT_ALGORITHM = "${{ secrets.JWT_ALGORITHM }}"
            JWT_EXPIRE_MINUTES = "${{ secrets.JWT_EXPIRE_MINUTES }}"
            JWT_REFRESH_EXPIRE_MINUTES = "${{ secrets.JWT_REFRESH_EXPIRE_MINUTES }}"
            GOOGLE_PLACES_API_KEY = "${{ secrets.GOOGLE_PLACES_API_KEY }}"
            GUARDIANX_API_KEY = "${{ secrets.GUARDIANX_API_KEY }}"
            REDIS_HOST="${{ secrets.REDIS_HOST }}"
            REDIS_PORT="${{ secrets.REDIS_PORT }}"
            REDIS_PASSWORD="${{ secrets.REDIS_PASSWORD }}"
            SENTRY_DSN="${{ secrets.SENTRY_DSN }}"
            SENTRY_ENVIRONMENT="production"
            SENTRY_TRACES_SAMPLE_RATE=0.1
            SENTRY_PROFILES_SAMPLE_RATE=0.0
          }

          image_uri = "${{ secrets.IMAGE_URI }}"
          EOF


      # -----------------------------
      # Terraform Import
      # -----------------------------
      - name: Terraform Import IncidentTable (idempotent)
        run: |
          cd terraform
          terraform import \
            -var-file=terraform.tfvars \
            aws_dynamodb_table.incident "${{ secrets.INCIDENT_TABLE_NAME }}" \
            || echo "Table already imported"


      # -----------------------------
      # Terraform Apply
      # -----------------------------
      - name: Terraform Apply
        run: |
          cd terraform
          terraform apply -auto-approve -var-file="terraform.tfvars"